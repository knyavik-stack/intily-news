name: Intily Regression Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: intily-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Установка media runtime
        run: |
          python3 -m pip install --disable-pip-version-check --no-cache-dir 'Pillow<10.0.0'

      - name: Regression tests
        run: |
          python3 -m py_compile scripts/intily_scoring_policy.py scripts/intily_audience_policy.py scripts/intily_google_news.py scripts/intily_image_pipeline.py scripts/intily_image_hardening.py scripts/intily_image_runtime.py scripts/intily_ai_news_runner.py scripts/intily_scoring_runtime_guard.py scripts/intily_production_entrypoint.py scripts/intily_cycle_intelligence.py scripts/intily_monitor.py scripts/intily_search_monitor.py scripts/intily_policy_analytics.py scripts/intily_audience_monitor.py scripts/intily_provider_recovery.py scripts/test_intily_google_news.py scripts/test_intily_image_pipeline.py scripts/test_intily_image_hardening.py scripts/test_intily_scoring_policy.py scripts/test_intily_audience_policy.py scripts/test_intily_image_runtime.py scripts/test_intily_scoring_runtime_guard.py scripts/test_intily_production_entrypoint.py scripts/test_intily_provider_recovery.py
          PYTHONPATH=scripts python3 -m unittest scripts/test_intily_google_news.py scripts/test_intily_image_pipeline.py scripts/test_intily_image_hardening.py scripts/test_intily_scoring_policy.py scripts/test_intily_audience_policy.py scripts/test_intily_image_runtime.py scripts/test_intily_scoring_runtime_guard.py scripts/test_intily_production_entrypoint.py scripts/test_intily_provider_recovery.py -v
