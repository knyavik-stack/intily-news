name: Intily Production Monitor

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build KPI dashboard
        run: |
          python3 scripts/intily_monitor.py | tee /tmp/intily-kpi.md
          cat /tmp/intily-kpi.md >> "$GITHUB_STEP_SUMMARY"
      - name: Search intelligence
        run: |
          python3 scripts/intily_search_monitor.py | tee /tmp/intily-search-monitor.md
          cat /tmp/intily-search-monitor.md >> "$GITHUB_STEP_SUMMARY"
      - name: Filter and weight analytics
        run: |
          python3 scripts/intily_policy_analytics.py | tee /tmp/intily-policy-monitor.md
          cat /tmp/intily-policy-monitor.md >> "$GITHUB_STEP_SUMMARY"
      - name: Check production alerts
        run: python3 scripts/intily_monitor.py --check
