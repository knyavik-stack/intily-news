name: Intily AI News Publisher

on:
  workflow_dispatch:

permissions:
  contents: write
  models: read

concurrency:
  group: intily-ai-news-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Проверка аналитики и политики
        run: |
          python3 -m py_compile scripts/intily_scoring_policy.py scripts/intily_ai_news_runner.py scripts/intily_image_pipeline.py scripts/intily_cycle_intelligence.py scripts/intily_monitor.py scripts/intily_search_monitor.py scripts/intily_policy_analytics.py
      - name: Запуск новостного двигателя
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_CHAT_ID: '@intily'
          STATE_FILE: data/intily-ai-news-state.json
        run: |
          set -o pipefail
          timeout 240s python3 scripts/intily_ai_news_runner.py 2>&1 | tee /tmp/intily-publisher.log

      - name: Аналитика текущего запуска
        if: always()
        continue-on-error: true
        run: |
          python3 scripts/intily_cycle_intelligence.py | tee /tmp/intily-current-analytics.md
          cat /tmp/intily-current-analytics.md >> "$GITHUB_STEP_SUMMARY"

      - name: Аналитика алгоритма отбора
        if: always()
        continue-on-error: true
        run: |
          python3 scripts/intily_policy_analytics.py | tee /tmp/intily-policy-analytics.md
          cat /tmp/intily-policy-analytics.md >> "$GITHUB_STEP_SUMMARY"

      - name: Сохранение состояния и аналитики
        if: always()
        run: |
          if [ -z "$(git status --porcelain -- data/intily-ai-news-state.json data/intily-query-intelligence.json 2>/dev/null)" ]; then
            echo 'Нет изменений состояния или аналитики.'
            exit 0
          fi

          git config user.name 'intily-ai-news[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          cp data/intily-ai-news-state.json /tmp/intily-ai-news-state.json 2>/dev/null || true
          cp data/intily-query-intelligence.json /tmp/intily-query-intelligence.json 2>/dev/null || true

          for attempt in 1 2 3; do
            echo "Попытка сохранения $attempt"
            git fetch origin main
            git reset --hard origin/main
            if [ -f /tmp/intily-ai-news-state.json ]; then cp /tmp/intily-ai-news-state.json data/intily-ai-news-state.json; fi
            if [ -f /tmp/intily-query-intelligence.json ]; then cp /tmp/intily-query-intelligence.json data/intily-query-intelligence.json; fi

            if [ -z "$(git status --porcelain -- data/intily-ai-news-state.json data/intily-query-intelligence.json 2>/dev/null)" ]; then
              echo 'Файлы уже соответствуют origin/main.'
              exit 0
            fi

            git add data/intily-ai-news-state.json data/intily-query-intelligence.json 2>/dev/null || true
            git commit -m 'chore(news): persist publisher analytics' || true

            if git push origin main; then
              echo 'Состояние и аналитика сохранены.'
              exit 0
            fi

            sleep 2
          done

          echo 'Не удалось сохранить состояние и аналитику после трёх попыток.'
          exit 1
