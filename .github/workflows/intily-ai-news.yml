name: Intily AI News Publisher

on:
  workflow_dispatch:

permissions:
  contents: write
  models: read

concurrency:
  group: intily-ai-news-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply verified admission telemetry hotfix
        run: |
          python3 scripts/apply_admission_hotfix.py
          if ! git diff --quiet -- scripts/intily_ai_news.py; then
            git config user.name 'intily-ai-news[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add scripts/intily_ai_news.py
            git commit -m 'fix(news): correct admission diagnostics'
            git push origin main
          fi
      - name: Run news engine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_CHAT_ID: '@intily'
          STATE_FILE: data/intily-ai-news-state.json
        run: timeout 240s python3 scripts/intily_ai_news.py
      - name: Production KPI summary
        if: always()
        continue-on-error: true
        run: |
          python3 scripts/intily_monitor.py | tee /tmp/intily-kpi.md
          cat /tmp/intily-kpi.md >> "$GITHUB_STEP_SUMMARY"

      - name: Persist state
        if: always()
        run: |
          if git diff --quiet -- data/intily-ai-news-state.json; then
            echo 'No state changes.'
            exit 0
          fi

          git config user.name 'intily-ai-news[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # State is a production artifact, while docs/code may be pushed to
          # main independently during the run. Preserve the generated state,
          # rebase it onto the newest main, and retry the push to avoid losing
          # state on a normal fast-forward race.
          cp data/intily-ai-news-state.json /tmp/intily-ai-news-state.json

          for attempt in 1 2 3; do
            echo "Persist attempt $attempt"
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/intily-ai-news-state.json data/intily-ai-news-state.json

            if git diff --quiet -- data/intily-ai-news-state.json; then
              echo 'State already matches origin/main.'
              exit 0
            fi

            git add data/intily-ai-news-state.json
            git commit -m 'chore(news): persist publisher state' || true

            if git push origin main; then
              echo 'State persisted.'
              exit 0
            fi

            sleep 2
          done

          echo 'State persistence failed after retries.'
          exit 1
